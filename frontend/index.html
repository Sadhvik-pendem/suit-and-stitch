      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-[#E8E4DA] pb-6 gap-4 no-print">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Boutique & Masterji Studio</span>
              <div className="flex flex-wrap items-center gap-3 mt-1">
                <h2 className="text-3xl font-serif-luxury">Stitching Orders Queue</h2>
                <div className="flex items-center gap-1.5 bg-white border border-[#E8E4DA] px-2.5 py-1 rounded-sm shadow-sm">
                  <span className="text-[9px] uppercase font-mono text-neutral-400 font-semibold">Atelier:</span>
                  <select
                    value={selectedBoutiqueId}
                    onChange={(e) => setSelectedBoutiqueId(e.target.value)}
                    className="text-xs bg-transparent outline-none font-medium text-neutral-800 cursor-pointer"
                  >
                    <option value="ALL">All Partner Studios ({orders.length})</option>
                    <option value="boutique_1">Darzi & Co. Haute Atelier ({orders.filter(o => o.boutiqueId === 'boutique_1').length})</option>
                    <option value="boutique_2">Priya Studio Luxe ({orders.filter(o => o.boutiqueId === 'boutique_2').length})</option>
                  </select>
                </div>
              </div>
            </div>
            <div className="flex border border-[#E8E4DA] text-xs">
              <button onClick={() => setTab('awaiting')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'awaiting' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100'}`}>
                Awaiting Measurements ({awaitingFitting.length})
              </button>
              <button onClick={() => setTab('production')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'production' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100'}`}>
                Active Stitching ({inProduction.length})
              </button>
              <button onClick={() => setTab('completed')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'completed' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100'}`}>
                Dispatched / Delivered ({completed.length})
              </button>
            </div>
          </div>

          {tab === 'production' && (
            <div className="space-y-6">
              {inProduction.length > 0 ? (
                inProduction.map(o => (
                  <div key={o.id} className="card-luxury p-8 flex flex-col lg:flex-row gap-8">
                    <div className="flex-1 space-y-4">
                      <div className="flex justify-between items-baseline">
                        <div className="flex items-center gap-2">
                          <span className="text-xs font-mono text-neutral-400">{o.id}</span>
                          <span className="text-[10px] uppercase font-mono px-2 py-0.5 bg-[#FAF8F5] border border-[#E8E4DA] text-[#C5A880] font-semibold">
                            {o.boutiqueName || 'Atelier'}
                          </span>
                        </div>
                        <div className="flex items-center gap-2 no-print">
                          <button 
                            onClick={() => window.print()} 
                            className="text-[10px] uppercase tracking-widest text-neutral-700 border border-[#E8E4DA] px-3 py-1 hover:border-black transition-all flex items-center gap-1.5"
                          >
                            <span>🖨</span> Print Measurement Slip
                          </button>
                          <button 
                            onClick={() => handlePrintPatternCard(o.id)} 
                            className="text-[10px] uppercase tracking-widest text-[#C5A880] border border-[#C5A880] px-3 py-1 hover:bg-[#C5A880] hover:text-white transition-all flex items-center gap-1.5"
                          >
                            <span>📄</span> Naap Card (PDF)
                          </button>
                        </div>
                      </div>
                      <h4 className="text-2xl font-serif-luxury">{o.designName}</h4>
                      <p className="text-xs text-neutral-600">Client: <strong>{o.customerName}</strong> ({o.deliveryAddress})</p>
                      <p className="text-xs text-neutral-600">Fabric: <strong>{o.selectedFabric}</strong></p>
                      
                      {o.customOptions && (
                        <div className="flex flex-wrap items-center gap-1.5 pt-1 text-[10px]">
                          <span className="bg-[#FAF8F5] border border-[#E8E4DA] px-2 py-0.5 text-neutral-800 font-medium">
                            {o.customOptions.sizingMethod === 'sample_garment' ? '📦 Sample Garment Fitting' : '📏 Home Sizing Visit'}
                          </span>
                          <span className="bg-white border border-[#E8E4DA] px-2 py-0.5 text-neutral-600">
                            Collar: <strong>{o.customOptions.collar || 'Standard Notch'}</strong>
                          </span>
                          <span className="bg-white border border-[#E8E4DA] px-2 py-0.5 text-neutral-600">
                            Pocket: <strong>{o.customOptions.pocket || 'Classic Flap'}</strong>
                          </span>
                          {o.customOptions.monogram && (
                            <span className="bg-[#121212] text-[#C5A880] border border-[#C5A880] px-2 py-0.5 font-bold font-mono">
                              ✦ {o.customOptions.monogram} ✦
                            </span>
                          )}
                        </div>
                      )}

                      <div className="pt-4 no-print">
                        {o.status === 'measurements_taken' ? (
                          <button 
                            onClick={() => handleStartStitching(o.id)} 
                            disabled={loadingId === o.id}
                            className="btn-luxury-solid w-full"
                          >
                            {loadingId === o.id ? 'Starting Stitching...' : 'Accept Measurements & Start Stitching'}
                          </button>
                        ) : (
                          <button 
                            onClick={() => handleMarkReady(o.id)} 
                            disabled={loadingId === o.id}
                            className="btn-luxury-solid w-full !bg-[#C5A880] !text-black hover:!bg-black hover:!text-white"
                          >
                            {loadingId === o.id ? 'Dispatching...' : 'Mark Stitched & Ready for Delivery'}
                          </button>
                        )}
                      </div>
                    </div>

                    <div className="print-pattern-card lg:max-w-md w-full bg-[#FAF8F5] border border-[#E8E4DA] p-6 font-mono text-xs">
                      <div className="flex justify-between items-baseline border-b border-dashed border-[#E8E4DA] pb-2">
                        <span className="text-[9px] uppercase tracking-widest text-neutral-400 font-sans">Measurement Sheet / Naap Card</span>
                        <span className="text-[9px] font-mono text-[#C5A880] font-bold">{o.id}</span>
                      </div>

                      {/* Sizing Method Specification */}
                      <div className="mt-2.5 mb-2 flex items-center justify-between bg-white border border-[#E8E4DA] p-2 text-[10px] font-sans">
                        <span className="text-neutral-500 uppercase font-mono text-[9px]">Sizing Method:</span>
                        <span className="font-semibold text-neutral-900">
                          {o.customOptions?.sizingMethod === 'sample_garment' 
                            ? '📦 Sample Fitting Garment (Naap Duplicate)' 
                            : '📏 Home Visit by Associate'}
                        </span>
                      </div>

                      <h5 className="font-bold text-sm tracking-wider mt-2">BODY MEASUREMENTS (IN INCHES)</h5>
                      {o.measurements ? (
                        <div className="grid grid-cols-2 gap-3 my-3">
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>CHEST SIZE:</span> <strong>{o.measurements.chest}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>WAIST SIZE:</span> <strong>{o.measurements.waist}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>HIP SIZE:</span> <strong>{o.measurements.hips}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>PANT LENGTH (INSEAM):</span> <strong>{o.measurements.inseam}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>NECK SIZE:</span> <strong>{o.measurements.neck}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>SHOULDER WIDTH:</span> <strong>{o.measurements.shoulders}"</strong></div>
                        </div>
                      ) : (
                        <p className="text-[10px] text-neutral-400 italic my-3">
                          {o.customOptions?.sizingMethod === 'sample_garment' 
                            ? 'Awaiting sample fitting garment collection from customer.' 
                            : 'Pending associate home visit & measurements.'}
                        </p>
                      )}

                      {/* Bespoke Styling & Monogram Specifications */}
                      <div className="mt-3 pt-3 border-t border-dashed border-[#E8E4DA] font-sans">
                        <span className="text-[9px] uppercase tracking-widest text-[#C5A880] font-bold block mb-1.5">
                          Bespoke Styling & Monogram Specs
                        </span>
                        <div className="grid grid-cols-2 gap-2 text-[10px]">
                          <div className="bg-white p-2 border border-[#E8E4DA]">
                            <span className="text-neutral-400 text-[9px] block uppercase font-mono">Lapel / Collar</span>
                            <strong className="text-neutral-900">{o.customOptions?.collar || 'Standard Notch'}</strong>
                          </div>
                          <div className="bg-white p-2 border border-[#E8E4DA]">
                            <span className="text-neutral-400 text-[9px] block uppercase font-mono">Pocket Style</span>
                            <strong className="text-neutral-900">{o.customOptions?.pocket || 'Classic Flap'}</strong>
                          </div>
                        </div>
                        {o.customOptions?.monogram ? (
                          <div className="mt-2 bg-[#121212] text-[#FAF8F5] p-2 flex items-center justify-between text-[11px] rounded-sm">
                            <span className="text-[#C5A880] text-[9px] uppercase font-mono tracking-wider">Custom Monogram Embroidery:</span>
                            <span className="font-serif-luxury tracking-[0.25em] text-sm font-bold text-[#C5A880] bg-white/10 px-2 py-0.5 rounded">
                              ✦ {o.customOptions.monogram} ✦
                            </span>
                          </div>
                        ) : (
                          <div className="mt-1 text-[9px] text-neutral-400 italic font-mono">Monogram: None requested</div>
                        )}
                      </div>

                      <p className="text-[10px] text-neutral-500 font-sans mt-3">Masterji Notes: {o.tailorNotes || 'Standard fit & finish.'}</p>
                    </div>
                  </div>
                ))
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">Stitching Queue Clear</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    No garments are currently in stitching. New orders with measurements will appear here automatically.
                  </p>
                </div>
              )}
            </div>
          )}

          {tab === 'awaiting' && (
            <div>
              {awaitingFitting.length > 0 ? (
                <div className="grid md:grid-cols-2 gap-6">
                  {awaitingFitting.map(o => (
                    <div key={o.id} className="card-luxury p-6 space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-mono text-neutral-400">{o.id}</span>
                        <span className="text-[9px] uppercase font-mono px-2 py-0.5 bg-[#FAF8F5] border border-[#E8E4DA] text-[#C5A880] font-semibold">
                          {o.boutiqueName || 'Atelier'}
                        </span>
                      </div>
                      <h4 className="text-lg font-serif-luxury">{o.designName}</h4>
                      <p className="text-xs text-neutral-500">
                        {o.customOptions?.sizingMethod === 'sample_garment'
                          ? `Sample garment collection scheduled for ${o.appointmentSlot} by ${o.associate ? o.associate.name : 'Field Associate'}.`
                          : `Home visit scheduled for ${o.appointmentSlot} by ${o.associate ? o.associate.name : 'Field Associate'}.`}
                      </p>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">No Orders Awaiting Measurements</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    All orders have either completed home measurements or moved into stitching.
                  </p>
                </div>
              )}
            </div>
          )}

          {tab === 'completed' && (
            <div>
              {completed.length > 0 ? (
                <div className="card-luxury p-6 overflow-x-auto text-xs">
                  <table className="w-full text-left font-light">
                    <thead>
                      <tr className="border-b border-[#E8E4DA] text-neutral-400 text-[10px] uppercase font-mono">
                        <th className="pb-3">Reference</th>
                        <th className="pb-3">Atelier</th>
                        <th className="pb-3">Customer</th>
                        <th className="pb-3">Garment</th>
                        <th className="pb-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#E8E4DA]">
                      {completed.map(o => (
                        <tr key={o.id}>
                          <td className="py-3 font-mono">{o.id}</td>
                          <td className="py-3 font-mono text-[11px] text-[#C5A880] font-medium">{o.boutiqueName || 'Atelier'}</td>
                          <td className="py-3 font-semibold">{o.customerName}</td>
                          <td className="py-3">{o.designName}</td>
                          <td className="py-3 uppercase font-mono text-[10px]">{o.status}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">No Dispatched Outfits Yet</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    Orders marked ready for delivery and completed customer handovers will be listed here.
                  </p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function DeliveryPartnerView({ orders, updateOrderStatus, currentUser, fetchOrders, showToast }) {
      const [loadingId, setLoadingId] = useState(null);
      const activeShipments = orders.filter(o => o.status === 'dispatched' || o.status === 'in_production');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handlePickup = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/logistics/orders/${orderId}/pickup`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'dispatched');
            if (fetchOrders) fetchOrders();
            notify(`Boutique pickup confirmed for order ${orderId}!`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Pickup failed: ${data.message || 'Could not confirm pickup.'}`, 'error');
          }
        } catch (err) {
          console.warn('API pickup failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'dispatched');
        notify(`Parcel ${orderId} marked picked up (local session).`, 'success');
        setLoadingId(null);
      };

      const handleDeliver = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/logistics/orders/${orderId}/deliver`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'delivered');
            if (fetchOrders) fetchOrders();
            notify(`Doorstep delivery confirmed for order ${orderId}!`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Delivery confirmation failed: ${data.message || 'Could not confirm handover.'}`, 'error');
          }
        } catch (err) {
          console.warn('API delivery failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'delivered');
        notify(`Order ${orderId} delivered to customer (local session).`, 'success');
        setLoadingId(null);
      };

      return (
        <div className="max-w-2xl mx-auto card-luxury p-8 md:p-10 space-y-6 animate-fade-in">
          <div className="border-b border-[#E8E4DA] pb-4">
            <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Delivery Fleet Portal</span>
            <h2 className="text-2xl md:text-3xl font-serif-luxury">Active Pickups & Deliveries</h2>
          </div>

          <div className="space-y-4">
            {activeShipments.length > 0 ? (
              activeShipments.map(o => (
                <div key={o.id} className="p-6 border border-[#E8E4DA] bg-neutral-50 space-y-3 hover:border-[#C5A880] transition-colors">
                  <div className="flex justify-between items-baseline">
                    <span className="text-xs font-mono font-bold text-neutral-900">{o.id}</span>
                    <span className="text-[9px] uppercase tracking-widest bg-neutral-200 px-2 py-0.5 font-semibold">
                      {o.status === 'in_production' ? 'Ready for Boutique Pickup' : 'Out for Delivery'}
                    </span>
                  </div>
                  <h4 className="text-base font-semibold">{o.designName}</h4>
                  
                  <div className="grid md:grid-cols-2 gap-4 text-xs font-light text-neutral-600 pt-2">
                    <div>
                      <span className="text-[9px] uppercase text-neutral-400 block font-semibold">Pickup Boutique:</span>
                      <p className="font-medium text-neutral-900">{o.boutiqueName}</p>
                    </div>
                    <div>
                      <span className="text-[9px] uppercase text-neutral-400 block font-semibold">Delivery Address:</span>
                      <p className="font-medium text-neutral-900">{o.customerName} ({o.deliveryAddress})</p>
                    </div>
                  </div>

                  <div className="pt-3">
                    {o.status === 'in_production' ? (
                      <button 
                        onClick={() => handlePickup(o.id)} 
                        disabled={loadingId === o.id}
                        className="btn-luxury-solid w-full !py-2 text-[10px]"
                      >
                        {loadingId === o.id ? 'Confirming Pickup...' : 'Confirm Studio Pickup'}
                      </button>
                    ) : (
                      <button 
                        onClick={() => handleDeliver(o.id)} 
                        disabled={loadingId === o.id}
                        className="btn-luxury-solid w-full !bg-green-700 !text-white hover:!bg-black !py-2 text-[10px]"
                      >
                        {loadingId === o.id ? 'Confirming Delivery...' : 'Confirm Doorstep Handover & Delivery'}
                      </button>
                    )}
                  </div>
                </div>
              ))
            ) : (
              <div className="border border-dashed border-[#E8E4DA] p-10 text-center space-y-3 bg-[#FAF8F5]/50">
                <div className="w-10 h-10 mx-auto rounded-full bg-white border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                  ✦
                </div>
                <h4 className="font-serif-luxury text-lg text-neutral-800">No Deliveries Pending</h4>
                <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                  No orders are currently waiting for boutique pickup or doorstep delivery.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
