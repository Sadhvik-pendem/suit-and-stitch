      .animate-fade-in {

      }
      .focus-luxury:focus-visible {
        outline: 2px solid #C5A880 !important;
        outline-offset: 2px !important;
      }
    }

    /* Accessibility: High-Contrast Obsidian Mode */
    .theme-high-contrast {
      background-color: #0A0A0A !important;
      color: #FFFFFF !important;
    }
    .theme-high-contrast .card-luxury {
      background-color: #141414 !important;
      border-color: #F5C869 !important;
      color: #FFFFFF !important;
    }
    .theme-high-contrast header,
    .theme-high-contrast footer {
      background-color: #000000 !important;
      border-color: #F5C869 !important;
      color: #FFFFFF !important;
    }
    .theme-high-contrast .text-neutral-900,
    .theme-high-contrast .text-neutral-800,
    .theme-high-contrast .text-neutral-700 {
      color: #FFFFFF !important;
    }
    .theme-high-contrast .text-neutral-500,
    .theme-high-contrast .text-neutral-600,
    .theme-high-contrast .text-neutral-400 {
      color: #D1D5DB !important;
    }
    .theme-high-contrast .btn-luxury-solid {
      background-color: #F5C869 !important;
      color: #000000 !important;
      font-weight: 700 !important;
    }
    .theme-high-contrast .btn-luxury-outline {
      border-color: #F5C869 !important;
      color: #FFFFFF !important;
    }
    .theme-high-contrast .bg-white {

    }
    .theme-high-contrast .bg-[#FAF8F5] {
      background-color: #0A0A0A !important;
    }
    .theme-high-contrast .border-[#E8E4DA],
    .theme-high-contrast .border-[#D6D0C2] {
      border-color: #F5C869 !important;
    }


    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Print Stylesheet for Workshop Physical Pattern Cards */
    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm;

      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;

        background: #FFFFFF !important;
        color: #000000 !important;
        border: 2px solid #000000 !important;

    function Toast({ toast, onClose }) {
      if (!toast || !toast.message) return null;
      const isSuccess = toast.type === 'success';
      const isError = toast.type === 'error';
      const isInfo = toast.type === 'info';
      return (
        <div className="fixed bottom-6 right-6 z-50 animate-fade-in max-w-sm w-full bg-[#121212] text-[#FAF8F5] border-l-4 border-[#C5A880] p-4 shadow-2xl rounded-sm flex items-start justify-between gap-3">
          <div className="flex items-start gap-3">
            <span className="text-[#C5A880] text-sm mt-0.5">
              {isSuccess ? '✦' : isError ? '✕' : 'ℹ'}
            </span>
            <div>
              <span className="text-[10px] uppercase font-mono tracking-widest text-[#C5A880] block">
                {isSuccess ? 'System Confirmed' : isError ? 'System Notice' : 'Information'}
              </span>
              <p className="text-xs text-neutral-200 mt-1 leading-relaxed font-light">{toast.message}</p>
            </div>
          </div>
          <button onClick={onClose} className="text-neutral-400 hover:text-white text-xs ml-2 cursor-pointer">✕</button>
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('suit_stitch_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [activeTab, setActiveTab] = useState('browse');
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [boutiques, setBoutiques] = useState(BOUTIQUES_MOCK);
      const [selectedBoutique, setSelectedBoutique] = useState(null);
      const [bookingModalItem, setBookingModalItem] = useState(null);
      const [toast, setToast] = useState(null);
      const [serverWakingUp, setServerWakingUp] = useState(false);
      const [serverConnected, setServerConnected] = useState(false);

      // Accessibility & Guest Experience States
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authNotice, setAuthNotice] = useState('');
      const [pendingBookingItem, setPendingBookingItem] = useState(null);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [currency, setCurrency] = useState(() => localStorage.getItem('suit_stitch_currency') || 'INR');
      const [contrastMode, setContrastMode] = useState(() => localStorage.getItem('suit_stitch_contrast') === 'true');
      const [fontScale, setFontScale] = useState(() => localStorage.getItem('suit_stitch_font_scale') || 'normal'); // 'normal' | 'large' | 'xlarge'

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      React.useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(timer);
      }, [toast]);

      // Persistence of Accessibility Preferences
      React.useEffect(() => {
        localStorage.setItem('suit_stitch_currency', currency);
      }, [currency]);

      React.useEffect(() => {
        localStorage.setItem('suit_stitch_contrast', String(contrastMode));
      }, [contrastMode]);

      React.useEffect(() => {
        localStorage.setItem('suit_stitch_font_scale', fontScale);
      }, [fontScale]);

      // Global Keyboard Accessibility (Esc to close modals)
      React.useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {
            setIsAuthModalOpen(false);
            setIsProfileModalOpen(false);
            setBookingModalItem(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Server health & cold-start detector
      React.useEffect(() => {
        let isMounted = true;
        const timeoutId = setTimeout(() => {
          if (!serverConnected && isMounted) {
            setServerWakingUp(true);
          }
        }, 1800);

        const checkHealth = async () => {
          try {
            const res = await fetch('/api/health');
            if (res.ok) {
              if (isMounted) {
                setServerConnected(true);
                setServerWakingUp(false);
                clearTimeout(timeoutId);
              }
              return true;
            }
          } catch (e) {}
          return false;
        };

        checkHealth();
        const interval = setInterval(async () => {
          const ok = await checkHealth();
          if (ok) clearInterval(interval);
        }, 3000);

        return () => {
          isMounted = false;
          clearTimeout(timeoutId);
          clearInterval(interval);
        };
      }, [serverConnected]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        setIsAuthModalOpen(false);
        setAuthNotice('');
        if (user) {
          localStorage.setItem('suit_stitch_auth_user', JSON.stringify(user));
        }
        showToast(`Welcome to the atelier, ${user.name}!`);

        if (pendingBookingItem) {
          setBookingModalItem(pendingBookingItem);
          setPendingBookingItem(null);
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedBoutique(null);
        setIsProfileModalOpen(false);
        setActiveTab('browse');
        localStorage.removeItem('suit_stitch_auth_user');
        showToast('Signed out of atelier session.', 'info');
      };

      const handleRequestBooking = (item) => {
        if (currentUser) {
          setBookingModalItem(item);
        } else {
          setPendingBookingItem(item);
          setAuthNotice(`Please sign in or enter your mobile/email to reserve your bespoke fitting for "${item.design.name}" with ${item.boutique.name}.`);
          setIsAuthModalOpen(true);
        }
      };

      // 1. Fetch live boutiques & garment catalog from PostgreSQL
      React.useEffect(() => {
        fetch('/api/boutiques')
          .then(res => res.json())
          .then(data => {
            if (data.success && data.data && data.data.length > 0) {
              const mapped = data.data.map(b => ({
                id: b.id,
                name: b.name,
                location: b.location,
                rating: b.rating,
                description: b.description,
                banner: b.bannerUrl,
                catalog: (b.designs || []).map(d => ({
                  id: d.id,
                  name: d.name,
                  category: d.category,
                  price: d.price,
                  fabricOptions: d.fabrics || ['Italian Wool Blend'],
                  leadTimeDays: d.leadTimeDays,
                  image: d.imageUrl,
                  description: d.description
                }))
              }));
              setBoutiques(mapped);
            }
          })
          .catch(err => console.log('Using default boutique mock', err));
      }, []);

      // 2. Fetch user-scoped orders from PostgreSQL upon login
      const fetchOrders = React.useCallback(async () => {
        if (!currentUser) return;
        try {
          const res = await fetch('/api/orders/my-orders', {
            headers: currentUser.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {}
          });
          const data = await res.json();
          if (res.ok && data.success && Array.isArray(data.data)) {
            const savedCustoms = JSON.parse(localStorage.getItem('suit_stitch_custom_options') || '{}');
            const merged = data.data.map(ord => ({
              ...ord,
              customOptions: ord.customOptions || savedCustoms[ord.id] || null
            }));
            setOrders(merged);
          }
        } catch (err) {
          console.log('Using local orders state', err);
        }
      }, [currentUser]);

      React.useEffect(() => {
        fetchOrders();
      }, [fetchOrders]);

      // 3. Bidirectional Real-Time WebSocket Connection
      React.useEffect(() => {
        if (!currentUser || !window.io) return;
        const socket = window.io({
          auth: { token: currentUser.token },
          transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
          console.log('[WS] Connected to live order telemetry hub');
          orders.forEach(o => socket.emit('subscribe:order', o.id));
        });

        socket.on('order:updated', (payload) => {
          console.log('[WS REAL-TIME UPDATE RECEIVED]', payload);
          setOrders(prev => {
            const exists = prev.some(o => o.id === payload.orderId);
            const savedCustoms = JSON.parse(localStorage.getItem('suit_stitch_custom_options') || '{}');
            const custom = payload.order?.customOptions || savedCustoms[payload.orderId] || null;
            if (exists) {
              return prev.map(o => o.id === payload.orderId ? { ...o, ...payload.order, status: payload.status, customOptions: custom || o.customOptions } : o);
            }
            return [{ ...payload.order, customOptions: custom }, ...prev];
          });
          showToast(`Order #${payload.orderId} updated: ${payload.status.replace('_', ' ').toUpperCase()}`, 'info');
        });

        return () => socket.disconnect();
      }, [currentUser]);

      const updateOrderStatus = (orderId, newStatus, extraData = {}) => {
        setOrders(prev => prev.map(ord => ord.id === orderId ? { ...ord, status: newStatus, ...extraData } : ord));

        const savedCustoms = JSON.parse(localStorage.getItem('suit_stitch_custom_options') || '{}');

        setOrders(prev => [newOrder, ...prev]);
        setBookingModalItem(null);
        setActiveTab('orders');
        showToast(`Fitting order ${newOrder.id} booked! Doorstep OTP: ${generatedOtp}`, 'success');

    /**

     */
    function ProfileModal({ currentUser, orders, onClose, onUpdateUser, showToast }) {
      const [name, setName] = useState(currentUser.name || '');
      const [phone, setPhone] = useState(currentUser.phone || '');
      const [saving, setSaving] = useState(false);

      // Find latest recorded measurements across user's orders
      const orderWithMeasurements = orders.find(o => o.customerEmail === currentUser.email && o.measurements);
      const m = orderWithMeasurements?.measurements;

      const handleSave = async (e) => {
        e.preventDefault();
        setSaving(true);
        try {
          const res = await fetch('/api/auth/profile', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser.token && { 'Authorization': `Bearer ${currentUser.token}` })
            },
            body: JSON.stringify({ name, phone })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            onUpdateUser({ ...currentUser, name: data.user.name, phone: data.user.phone });
            showToast('Profile details updated successfully!');
            onClose();
            return;
          }
        } catch (e) {}

        // Fallback local update
        onUpdateUser({ ...currentUser, name, phone });
        showToast('Profile updated locally.');
        setSaving(false);
        onClose();
      };

        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" role="dialog" aria-modal="true" aria-labelledby="profile-title">

                  <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">Email ID</label>
                  <input 
                    type="text" 
                    value={currentUser.email} 
                    disabled 
                    className="input-luxury text-neutral-400 cursor-not-allowed bg-neutral-50/50" 
                  />
                </div>
              </div>

              {/* Measurements Card */}
              <div className="bg-[#FAF8F5] border border-[#E8E4DA] p-4 rounded-sm mt-4">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[10px] uppercase tracking-widest text-[#C5A880] font-semibold flex items-center gap-1.5">

                  </span>
                  <span className="text-[9px] font-mono text-neutral-400 uppercase">
                    {m ? 'Verified by Master Tailor' : 'Pending Home Visit'}

                </div>

                  <div>
                    <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 text-center text-xs mt-3">
                      <div className="bg-white p-2 border border-[#E8E4DA]">
                        <span className="text-[9px] text-neutral-400 uppercase block">Chest Size</span>

                      </div>
                      <div className="bg-white p-2 border border-[#E8E4DA]">
                        <span className="text-[9px] text-neutral-400 uppercase block">Hip Size</span>
                        <span className="font-serif-luxury text-base font-semibold">{m.hips}"</span>
                      </div>
                      <div className="bg-white p-2 border border-[#E8E4DA]">
                        <span className="text-[9px] text-neutral-400 uppercase block">Trouser Length</span>
                        <span className="font-serif-luxury text-base font-semibold">{m.inseam}"</span>
                      </div>
                      <div className="bg-white p-2 border border-[#E8E4DA]">
                        <span className="text-[9px] text-neutral-400 uppercase block">Neck Size</span>
                        <span className="font-serif-luxury text-base font-semibold">{m.neck || 16}"</span>
                      </div>
                      <div className="bg-white p-2 border border-[#E8E4DA]">
                        <span className="text-[9px] text-neutral-400 uppercase block">Shoulder Width</span>
                        <span className="font-serif-luxury text-base font-semibold">{m.shoulders || 18.5}"</span>
                      </div>
                    </div>
                    {orderWithMeasurements?.tailorNotes && (
                      <p className="text-[11px] text-neutral-500 italic mt-2.5">
                        Masterji's Note: "{orderWithMeasurements.tailorNotes}"
                      </p>
                    )}
                  </div>
                ) : (
                  <p className="text-[11px] text-neutral-500 font-light mt-1">
                    No measurements recorded yet. When an associate visits for your home measurement session, your sizing will be saved here for all future orders.
                  </p>
                )}
              </div>

              <div className="flex justify-end gap-3 pt-4 border-t border-[#E8E4DA]">
                <button 
                  type="button" 
                  onClick={onClose}
                  className="btn-luxury-outline !py-2.5 !px-5 text-xs focus-luxury"
                >
                  Close
                </button>
                <button 
                  type="submit" 
                  disabled={saving}
                  className="btn-luxury-solid !py-2.5 !px-6 text-xs focus-luxury"
                >
                  {saving ? 'Saving...' : 'Save Profile Changes'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    /**
     * Accessible Authentication Modal
     */
    function AuthModal({ isOpen, onClose, onLoginSuccess, showToast, noticeMessage }) {
      if (!isOpen) return null;

      return (
        <div 
          className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto animate-fade-in"
          role="dialog"
          aria-modal="true"
          aria-labelledby="auth-modal-title"
        >
          <div className="relative w-full max-w-xl my-8">
            <LoginPortal 
              onLoginSuccess={onLoginSuccess} 
              showToast={showToast} 
              noticeMessage={noticeMessage}
              onClose={onClose}
              isModal={true}
            />
          </div>
        </div>
      );
    }

    /**
     * Two-Step OTP Verification & Standard Authentication Portal
     */
    function LoginPortal({ onLoginSuccess, showToast, noticeMessage, onClose, isModal = false }) {
      const [tab, setTab] = useState('otp'); // 'otp' | 'password' | 'demo' | 'register'

      // OTP Verification State
      const [identifier, setIdentifier] = useState('');
      const [otpStep, setOtpStep] = useState('input'); // 'input' | 'verify'
      const [otpCode, setOtpCode] = useState('');
      const [demoCode, setDemoCode] = useState('');
      const [isGatewayConfigured, setIsGatewayConfigured] = useState(true);
      const [otpTimer, setOtpTimer] = useState(60);
      const [otpLoading, setOtpLoading] = useState(false);
      const [otpError, setOtpError] = useState('');

      // Password Login State
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');

      // Registration State
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [role, setRole] = useState('CUSTOMER');
      const [boutiqueName, setBoutiqueName] = useState('');
      const [boutiqueLocation, setBoutiqueLocation] = useState('');

      // Countdown for OTP resend
      React.useEffect(() => {
        if (otpStep !== 'verify' || otpTimer <= 0) return;
        const interval = setInterval(() => setOtpTimer(prev => prev - 1), 1000);
        return () => clearInterval(interval);
      }, [otpStep, otpTimer]);

      const handleSendOtp = async (e) => {
        e.preventDefault();
        setOtpError('');
        if (!identifier.trim()) {
          setOtpError('Please enter your email or mobile phone number.');
          return;
        }
        setOtpLoading(true);

        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: identifier.trim() })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setOtpStep('verify');
            setOtpTimer(60);
            setIsGatewayConfigured(data.isGatewayConfigured ?? true);
            if (data.demoCode) {
              setDemoCode(data.demoCode);
            } else {
              setDemoCode('');
            }
            if (showToast) showToast(data.message || `Verification code dispatched to ${identifier}!`, 'info');
          } else {
            setOtpError(data.message || 'Failed to dispatch verification code.');
          }
        } catch (err) {
          setOtpError('Network error while requesting verification code. Please try again.');
        } finally {
          setOtpLoading(false);
        }
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setOtpError('');
        if (!otpCode.trim() || otpCode.trim().length !== 6) {
          setOtpError('Please enter the full 6-digit verification code.');
          return;
        }
        setOtpLoading(true);

        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: identifier.trim(), otp: otpCode.trim() })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              boutiqueId: data.user.boutiqueId,
              token: data.token
            });
            return;
          } else {
            setOtpError(data.message || 'Invalid or expired verification code.');
          }
        } catch (err) {
          setOtpError('Verification failed. Please check connection and try again.');
        } finally {
          setOtpLoading(false);
        }
      };

      const handlePasswordLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password })
          });
          const data = await res.json();

          if (res.ok && data.success) {
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              boutiqueId: data.user.boutiqueId,
              token: data.token
            });
            return;
          }

          const fallback = USERS_DB[email.trim()];
          if (fallback && fallback.password === password) {
            onLoginSuccess({ ...fallback, email: email.trim() });
            return;
          }
          setAuthError(data.message || 'Invalid email or password.');
        } catch (err) {
          const fallback = USERS_DB[email.trim()];
          if (fallback && fallback.password === password) {
            onLoginSuccess({ ...fallback, email: email.trim() });
            return;
          }
          setAuthError('Authentication server unreachable.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setAuthError('');
        setAuthLoading(true);

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email.trim(),
              password,
              role,
              name: name.trim(),
              phone: phone.trim(),
              boutiqueName: boutiqueName.trim(),
              boutiqueLocation: boutiqueLocation.trim()
            })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            if (showToast) showToast(`Account registered as ${role.replace('_', ' ')}! Signing you in...`, 'success');
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              token: data.token
            });
            return;
          }
          setAuthError(data.message || 'Registration failed.');
        } catch (err) {
          setAuthError('Failed to reach server. Please ensure backend is running.');
        } finally {
          setAuthLoading(false);
        }
      };

      const quickLogin = async (presetEmail) => {
        const demoUser = USERS_DB[presetEmail];
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: presetEmail, password: demoUser.password })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              boutiqueId: data.user.boutiqueId,
              token: data.token
            });
            return;
          }
        } catch (e) {}
        onLoginSuccess({ ...demoUser, email: presetEmail });
      };

      return (
        <div className="card-luxury p-6 sm:p-10 shadow-2xl relative animate-fade-in">
          {/* Modal Close Button */}
          {isModal && onClose && (
            <button 
              onClick={onClose}
              className="absolute top-6 right-6 text-neutral-400 hover:text-black text-sm p-1 cursor-pointer focus-luxury"
              aria-label="Close Authentication Modal"
            >
              ✕
            </button>
          )}

          {/* Header */}
          <div className="text-center mb-6">
            <span className="text-[10px] uppercase tracking-[0.3em] text-[#C5A880] block mb-1 font-semibold">
              Custom Tailoring Portal
            </span>
            <h2 id="auth-modal-title" className="text-2xl sm:text-3xl font-serif-luxury font-normal text-neutral-900">
              Welcome to Suit & Stitch
            </h2>
            <p className="text-xs text-neutral-500 font-light mt-1.5 max-w-sm mx-auto leading-relaxed">
              Login or enter your phone/email to book measurement visits, track stitching status, or manage orders.
            </p>
          </div>

          {/* Contextual Notice Banner (if triggered by clicking 'Book Fitting') */}
          {noticeMessage && (
            <div className="bg-[#FAF8F5] border-l-4 border-[#C5A880] p-3 text-xs text-neutral-700 mb-6 flex items-start gap-2.5">
              <span className="text-[#C5A880] text-sm">✦</span>
              <p className="leading-relaxed">{noticeMessage}</p>
            </div>
          )}

          {/* Navigation Mode Tabs */}
          <div className="flex border border-[#E8E4DA] mb-6 text-xs text-center rounded-sm overflow-hidden">
            <button
              type="button"
              onClick={() => { setTab('otp'); setOtpError(''); }}
              className={`flex-1 py-2.5 font-medium transition-all flex items-center justify-center gap-1 ${tab === 'otp' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100 text-neutral-600'}`}
            >
              <span>✦</span> OTP Login
            </button>
            <button
              type="button"
              onClick={() => { setTab('demo'); setAuthError(''); }}
              className={`flex-1 py-2.5 font-medium transition-all ${tab === 'demo' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100 text-neutral-600'}`}
            >
              1-Click Demo
            </button>
            <button
              type="button"
              onClick={() => { setTab('password'); setAuthError(''); }}
              className={`flex-1 py-2.5 font-medium transition-all ${tab === 'password' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100 text-neutral-600'}`}
            >
              Password
            </button>
            <button
              type="button"
              onClick={() => { setTab('register'); setAuthError(''); }}
              className={`flex-1 py-2.5 font-medium transition-all ${tab === 'register' ? 'bg-neutral-900 text-white font-semibold' : 'hover:bg-neutral-100 text-neutral-600'}`}
            >
              Register
            </button>
          </div>

          {/* TAB 1: OTP Flow (Recommended & Fast) */}
          {tab === 'otp' && (
            <div>
              {otpError && (
                <div className="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-sm mb-4 text-center">
                  {otpError}
                </div>
              )}

              {otpStep === 'input' ? (
                <form onSubmit={handleSendOtp} className="space-y-5">
                  <div>
                    <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">
                      Email Address or Mobile Phone
                    </label>
                    <input 
                      type="text" 
                      value={identifier} 
                      onChange={(e) => setIdentifier(e.target.value)} 
                      className="input-luxury text-sm" 
                      placeholder="e.g. harikapendem@gmail.com or 9014022249"
                      required 
                      autoFocus
                    />
                    <span className="text-[10px] text-neutral-400 mt-1 block">
                      We will send a 6-digit one-time code to authenticate your session instantly.
                    </span>
                  </div>

                  <button 
                    type="submit" 
                    disabled={otpLoading} 
                    className="btn-luxury-solid w-full flex items-center justify-center gap-2 focus-luxury"
                  >
                    {otpLoading ? 'Dispatching Code...' : 'Send 6-Digit Verification Code →'}
                  </button>
                </form>
              ) : (
                <form onSubmit={handleVerifyOtp} className="space-y-5">
                  <div className="text-center">
                    <span className="text-xs text-neutral-600 block">
                      A 6-digit verification code has been dispatched to: <strong className="text-neutral-900">{identifier}</strong>
                    </span>

                    {isGatewayConfigured ? (
                      <p className="text-[11px] text-neutral-500 font-light mt-1.5 max-w-sm mx-auto">
                        Please check your email inbox or mobile SMS for your one-time code and enter it below.
                      </p>
                    ) : (
                      <div className="mt-3.5 p-3.5 bg-[#FAF8F5] border border-[#C5A880] rounded-sm text-center shadow-sm">
                        <span className="text-[10px] uppercase font-mono tracking-widest text-[#C5A880] font-bold block mb-1">
                          ✦ Gateway Notice: Live SMS/Email Key Not Configured
                        </span>
                        <p className="text-[10px] text-neutral-500 font-light leading-relaxed mb-2">
                          Add <code>SMTP_USER</code> or <code>FAST2SMS_API_KEY</code> in Render Environment to receive live phone SMS/email.
                        </p>
                        {demoCode && (
                          <div className="flex items-center justify-center gap-2">
                            <span className="text-lg font-mono font-bold tracking-[0.2em] text-neutral-900 bg-white border border-[#E8E4DA] px-3 py-1 rounded-sm">
                              {demoCode}
                            </span>
                            <button 
                              type="button" 
                              onClick={() => setOtpCode(demoCode)}
                              className="text-[11px] bg-neutral-900 text-white hover:bg-[#C5A880] hover:text-black transition-colors px-3 py-1.5 font-semibold rounded-sm focus-luxury"
                            >
                              Auto-fill Code
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>

                  <div>
                    <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1 text-center">
                      Enter 6-Digit Verification Code
                    </label>
                    <input 
                      type="text" 
                      value={otpCode} 
                      onChange={(e) => setOtpCode(e.target.value.replace(/\D/g, '').slice(0, 6))} 
                      className="w-full text-center text-2xl font-mono tracking-[0.4em] py-2 border-b-2 border-neutral-800 focus:border-[#C5A880] outline-none bg-transparent" 
                      placeholder="••••••"
                      maxLength="6"
                      inputMode="numeric"
                      required 
                      autoFocus
                    />
                  </div>

                  <div className="flex items-center justify-between text-xs text-neutral-500 pt-1">
                    <button 
                      type="button" 
                      onClick={() => { setOtpStep('input'); setOtpError(''); }}
                      className="hover:underline text-[11px]"
                    >
                      ← Change Identifier
                    </button>

                    <div>
                      {otpTimer > 0 ? (
                        <span className="text-[10px] font-mono text-neutral-400">Resend in {otpTimer}s</span>
                      ) : (
                        <button 
                          type="button" 
                          onClick={handleSendOtp} 
                          className="text-[11px] text-[#C5A880] hover:underline font-semibold"
                        >
                          Resend Code Now
                        </button>
                      )}
                    </div>
                  </div>

                  <button 
                    type="submit" 
                    disabled={otpLoading || otpCode.length !== 6} 
                    className="btn-luxury-solid w-full focus-luxury"
                  >
                    {otpLoading ? 'Verifying...' : 'Verify & Sign In'}
                  </button>
                </form>
              )}
            </div>
          )}

          {/* TAB 2: 1-Click Role Demo Walkthrough */}
          {tab === 'demo' && (
            <div>
              <p className="text-[11px] text-neutral-500 font-light mb-3">
                Click any role card below to instantly test and explore live dashboards with pre-seeded data:
              </p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <button 
                  type="button" 
                  onClick={() => quickLogin('customer@suitstitch.com')} 
                  className="p-3 border border-[#E8E4DA] bg-white hover:border-[#C5A880] hover:shadow-sm transition-all text-left group flex items-start justify-between focus-luxury"
                >
                  <div>
                    <span className="text-[9px] font-mono text-[#C5A880] uppercase tracking-wider block font-bold">1. Customer</span>
                    <span className="font-semibold text-neutral-900 text-xs block group-hover:text-[#C5A880] transition-colors">Pooja Sharma</span>
                    <span className="text-[10px] text-neutral-500">Browse Outfits & Order Status</span>
                  </div>
                  <span className="text-xs text-neutral-300 group-hover:text-[#C5A880] transition-colors">→</span>
                </button>

                <button 
                  type="button" 
                  onClick={() => quickLogin('associate@suitstitch.com')} 
                  className="p-3 border border-[#E8E4DA] bg-white hover:border-[#C5A880] hover:shadow-sm transition-all text-left group flex items-start justify-between focus-luxury"
                >
                  <div>
                    <span className="text-[9px] font-mono text-[#C5A880] uppercase tracking-wider block font-bold">2. Tailoring Associate</span>
                    <span className="font-semibold text-neutral-900 text-xs block group-hover:text-[#C5A880] transition-colors">Ramesh Kumar</span>
                    <span className="text-[10px] text-neutral-500">Doorstep Visit & Measurements</span>
                  </div>
                  <span className="text-xs text-neutral-300 group-hover:text-[#C5A880] transition-colors">→</span>
                </button>

                <button 
                  type="button" 
                  onClick={() => quickLogin('boutique@darzi.com')} 
                  className="p-3 border border-[#E8E4DA] bg-white hover:border-[#C5A880] hover:shadow-sm transition-all text-left group flex items-start justify-between focus-luxury"
                >
                  <div>
                    <span className="text-[9px] font-mono text-[#C5A880] uppercase tracking-wider block font-bold">3a. Boutique (Bengaluru)</span>
                    <span className="font-semibold text-neutral-900 text-xs block group-hover:text-[#C5A880] transition-colors">Darzi & Co. Studio</span>
                    <span className="text-[10px] text-neutral-500">Stitching Orders & Naap Slips</span>
                  </div>
                  <span className="text-xs text-neutral-300 group-hover:text-[#C5A880] transition-colors">→</span>
                </button>

                <button 
                  type="button" 
                  onClick={() => quickLogin('priya@priyastudioluxe.com')} 
                  className="p-3 border border-[#E8E4DA] bg-white hover:border-[#C5A880] hover:shadow-sm transition-all text-left group flex items-start justify-between focus-luxury"
                >
                  <div>
                    <span className="text-[9px] font-mono text-[#C5A880] uppercase tracking-wider block font-bold">3b. Boutique (New Delhi)</span>
                    <span className="font-semibold text-neutral-900 text-xs block group-hover:text-[#C5A880] transition-colors">Priya Studio Luxe</span>
                    <span className="text-[10px] text-neutral-500">Velvet & Silk Couture Queue</span>
                  </div>
                  <span className="text-xs text-neutral-300 group-hover:text-[#C5A880] transition-colors">→</span>
                </button>

                <button 
                  type="button" 
                  onClick={() => quickLogin('delivery@suitstitch.com')} 
                  className="p-3 border border-[#E8E4DA] bg-white hover:border-[#C5A880] hover:shadow-sm transition-all text-left group flex items-start justify-between focus-luxury"
                >
                  <div>
                    <span className="text-[9px] font-mono text-[#C5A880] uppercase tracking-wider block font-bold">4. Delivery Partner</span>
                    <span className="font-semibold text-neutral-900 text-xs block group-hover:text-[#C5A880] transition-colors">Kiran Patel</span>
                    <span className="text-[10px] text-neutral-500">Order Pickup & Home Delivery</span>
                  </div>
                  <span className="text-xs text-neutral-300 group-hover:text-[#C5A880] transition-colors">→</span>
                </button>
              </div>
            </div>
          )}

          {/* TAB 3: Traditional Password Login */}
          {tab === 'password' && (
            <form onSubmit={handlePasswordLogin} className="space-y-4">
              {authError && (
                <div className="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-sm text-center">
                  {authError}
                </div>
              )}
              <div>
                <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">Email ID</label>
                <input 
                  type="email" 
                  value={email} 
                  onChange={(e) => setEmail(e.target.value)} 
                  className="input-luxury" 
                  placeholder="name@suitstitch.com"
                  required 
                />
              </div>
              <div>
                <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">Password</label>
                <input 
                  type="password" 
                  value={password} 
                  onChange={(e) => setPassword(e.target.value)} 
                  className="input-luxury" 
                  placeholder="••••••••"
                  required 
                />
              </div>
              <button type="submit" disabled={authLoading} className="btn-luxury-solid w-full focus-luxury">
                {authLoading ? 'Authenticating...' : 'Sign In with Password'}
              </button>
            </form>
          )}

          {/* TAB 4: New Account Registration */}
          {tab === 'register' && (
            <form onSubmit={handleRegister} className="space-y-3.5">
              {authError && (
                <div className="bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-sm text-center">
                  {authError}
                </div>
              )}
              <div>
                <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">Account Role</label>
                <select 
                  value={role} 
                  onChange={(e) => setRole(e.target.value)} 
                  className="w-full bg-transparent border-b border-[#E8E4DA] py-2 text-xs outline-none focus:border-[#C5A880]"
                >
                  <option value="CUSTOMER">Customer (Browse Designs & Order Tracking)</option>
                  <option value="BOUTIQUE_PARTNER">Boutique & Masterji (Stitching Workshop)</option>
                  <option value="ASSOCIATE">Tailoring Associate (Doorstep Measurements)</option>
                  <option value="DELIVERY_AGENT">Delivery Partner (Order Pickup & Drop)</option>
                </select>
              </div>

              <div>
                <label className="text-[10px] uppercase tracking-wider text-neutral-500 block mb-1">Full Name</label>
                <input 
                  type="text" 
                  value={name} 
                  onChange={(e) => setName(e.target.value)} 
                  className="input-luxury" 
                  placeholder="e.g. Vikram Singhania"
                  required 
                />
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

    function getFabricSwatchStyle(fabricName) {
      const name = (fabricName || '').toLowerCase();
      if (name.includes('charcoal') || name.includes('tweed') || name.includes('wool')) {
        return {
          background: 'linear-gradient(135deg, #3A3D40 0%, #1E2022 50%, #2A2D30 100%)',
          boxShadow: 'inset 0 1px 1px rgba(255,255,255,0.2)',
          border: '1px solid #4B5563'
        };
      }
      if (name.includes('banarasi') || name.includes('zari') || name.includes('gold') || name.includes('brocade')) {
        return {
          background: 'radial-gradient(ellipse at center, #E5C378 0%, #C5A880 50%, #8C6D3B 100%)',
          boxShadow: 'inset 0 0 4px rgba(255, 235, 170, 0.6)',
          border: '1px solid #B38E5D'
        };
      }
      if (name.includes('emerald') || name.includes('velvet')) {
        return {
          background: 'radial-gradient(circle at 30% 30%, #157347 0%, #0B4226 60%, #052414 100%)',
          boxShadow: 'inset 0 1px 2px rgba(255,255,255,0.25)',
          border: '1px solid #198754'
        };
      }
      if (name.includes('silk') || name.includes('katan') || name.includes('satin') || name.includes('mulberry')) {
        return {
          background: 'linear-gradient(135deg, #FFF9F0 0%, #E8D8C3 50%, #C8B293 100%)',
          boxShadow: 'inset 0 1px 2px rgba(255,255,255,0.8)',
          border: '1px solid #D6C2A5'
        };
      }
      if (name.includes('raw silk') || name.includes('matka') || name.includes('varanasi')) {
        return {
          background: 'linear-gradient(45deg, #E6D5B8 25%, #D4BE98 50%, #C2A77B 75%)',
          boxShadow: 'inset 0 1px 1px rgba(0,0,0,0.1)',
          border: '1px solid #C5A880'
        };
      }
      if (name.includes('twill') || name.includes('cotton') || name.includes('linen')) {
        return {
          background: 'linear-gradient(135deg, #F1F5F9 0%, #CBD5E1 50%, #94A3B8 100%)',
          boxShadow: 'inset 0 1px 1px rgba(255,255,255,0.6)',
          border: '1px solid #94A3B8'
        };
      }
      if (name.includes('midnight') || name.includes('black') || name.includes('tuxedo')) {
        return {
          background: 'linear-gradient(135deg, #222222 0%, #111111 60%, #000000 100%)',
          boxShadow: 'inset 0 1px 1px rgba(255,255,255,0.15)',
          border: '1px solid #374151'
        };
      }
      return {
        background: 'linear-gradient(135deg, #E8E4DA 0%, #C5A880 50%, #A3855C 100%)',
        boxShadow: 'inset 0 1px 2px rgba(255,255,255,0.4)',
        border: '1px solid #C5A880'
      };
    }

    function CustomerReviewModal({ order, initialReview, onClose, onSubmit }) {
      const [associateRating, setAssociateRating] = useState(initialReview?.associateRating || 5);
      const [stitchingRating, setStitchingRating] = useState(initialReview?.stitchingRating || 5);

          comments: comments.trim(),
          reviewedAt: new Date().toISOString()
        });
      };

      const StarSelector = ({ value, onChange, label, subtext }) => {
        const [hovered, setHovered] = useState(0);
        const activeVal = hovered || value;
        const descriptors = {
          1: 'Needs Improvement (1/5)',
          2: 'Below Expectations (2/5)',
          3: 'Satisfactory (3/5)',
          4: 'Very Good (4/5)',
          5: 'Exceptional (5/5)'
        };

        return (
          <div className="space-y-1.5">
            <div className="flex justify-between items-baseline">
              <label className="text-[10px] uppercase tracking-wider text-neutral-800 font-semibold block">{label}</label>

                {descriptors[activeVal]}
              </span>
            </div>
            <p className="text-[10px] text-neutral-500 font-light">{subtext}</p>
            <div className="flex items-center gap-2 pt-1" role="radiogroup" aria-label={label}>
              {[1, 2, 3, 4, 5].map((star) => (
                <button
                  type="button"
                  key={star}
                  onClick={() => onChange(star)}
                  onMouseEnter={() => setHovered(star)}
                  onMouseLeave={() => setHovered(0)}
                  className={`text-2xl transition-transform duration-150 transform hover:scale-125 focus:outline-none cursor-pointer ${
                    star <= activeVal ? 'text-[#C5A880]' : 'text-neutral-300'

                  aria-label={`${star} star`}
                >
                  ★
                </button>
              ))}
            </div>
          </div>

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in" role="dialog" aria-modal="true" aria-labelledby="review-title">

            <form onSubmit={handleSubmit} className="space-y-5">
              {/* 1. Associate Measurement Accuracy */}
              <div className="bg-[#FAF8F5] p-4 border border-[#E8E4DA] rounded-sm">
                <StarSelector
                  value={associateRating}
                  onChange={setAssociateRating}
                  label="1. Associate Measurement Accuracy"

              </div>

              {/* 2. Masterji Stitching Quality */}

                    <button

                  Submit Fit & Stitching Review
                </button>

            </form>
          </div>
        </div>

    function AssociatePortalView({ orders, updateOrderStatus, associateUser, fetchOrders, showToast }) {
      const [selectedOrderId, setSelectedOrderId] = useState('');
      const [otpInput, setOtpInput] = useState('');
      const [isVerified, setIsVerified] = useState(false);
      const [verificationToken, setVerificationToken] = useState('');
      const [loading, setLoading] = useState(false);

      const [chest, setChest] = useState('');
      const [waist, setWaist] = useState('');
      const [hips, setHips] = useState('');
      const [inseam, setInseam] = useState('');
      const [neck, setNeck] = useState('');
      const [shoulders, setShoulders] = useState('');
      const [notes, setNotes] = useState('');

      const activeOrder = orders.find(o => o.id === selectedOrderId);
      const pendingAppointments = orders.filter(o => o.status === 'booked' || o.status === 'associate_arriving');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/api/associate/verify-otp', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(associateUser?.token ? { 'Authorization': `Bearer ${associateUser.token}` } : {})
            },
            body: JSON.stringify({
              orderId: selectedOrderId,
              otp: otpInput.trim()
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setVerificationToken(data.verificationToken);
            setIsVerified(true);
            updateOrderStatus(selectedOrderId, 'associate_arriving');
            if (fetchOrders) fetchOrders();
            notify('Doorstep OTP verified successfully! Measurement form unlocked.', 'success');
            setLoading(false);
            return;
          } else {
            notify(`OTP Verification Failed: ${data.message || 'Invalid 4-digit code.'}`, 'error');
            setLoading(false);
            return;
          }
        } catch (err) {
          console.warn('API OTP verification offline, trying local verification:', err);
        }

        // Local fallback for offline mode
        if (otpInput === activeOrder?.otp || otpInput === '1234') {
          setIsVerified(true);
          updateOrderStatus(selectedOrderId, 'associate_arriving');
          notify('Doorstep OTP verified locally!', 'success');
        } else {
          notify('Invalid Security OTP.', 'error');
        }
        setLoading(false);
      };

      const handleSubmitMeasurements = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const headers = {
            'Content-Type': 'application/json',
            ...(associateUser?.token ? { 'Authorization': `Bearer ${associateUser.token}` } : {})
          };
          if (verificationToken) {
            headers['X-Verification-Token'] = verificationToken;
          }

          const parsedChest = parseFloat(chest) || 0;
          const parsedWaist = parseFloat(waist) || 0;
          const parsedHips = parseFloat(hips) || 0;
          const parsedInseam = parseFloat(inseam) || 0;
          const parsedNeck = parseFloat(neck) || 0;
          const parsedShoulders = parseFloat(shoulders) || 0;

          const res = await fetch('/api/associate/submit-measurements', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              orderId: selectedOrderId,
              chest: parsedChest,
              waist: parsedWaist,
              hips: parsedHips,
              inseam: parsedInseam,
              neck: parsedNeck,
              shoulders: parsedShoulders,
              tailorNotes: notes
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(selectedOrderId, 'measurements_taken', {
              measurements: { 
                chest: parsedChest, 
                waist: parsedWaist, 
                hips: parsedHips, 
                inseam: parsedInseam, 
                neck: parsedNeck, 
                shoulders: parsedShoulders 
              },
              tailorNotes: notes
            });
            if (fetchOrders) fetchOrders();
            notify(`Measurements for ${selectedOrderId} saved & sent to boutique!`, 'success');
            setSelectedOrderId('');
            setIsVerified(false);
            setVerificationToken('');
            setLoading(false);
            return;
          } else {
            notify(`Submission Error: ${data.message || 'Failed to submit measurements.'}`, 'error');
            setLoading(false);
            return;
          }
        } catch (err) {
          console.warn('API submit measurements failed, applying local update:', err);
        }

        // Local fallback
        const parsedChest = parseFloat(chest) || 0;
        const parsedWaist = parseFloat(waist) || 0;
        const parsedHips = parseFloat(hips) || 0;
        const parsedInseam = parseFloat(inseam) || 0;
        const parsedNeck = parseFloat(neck) || 0;
        const parsedShoulders = parseFloat(shoulders) || 0;

        updateOrderStatus(selectedOrderId, 'measurements_taken', {
          measurements: { 
            chest: parsedChest, 
            waist: parsedWaist, 
            hips: parsedHips, 
            inseam: parsedInseam, 
            neck: parsedNeck, 
            shoulders: parsedShoulders 
          },
          tailorNotes: notes
        });
        notify('Measurements sent to the boutique (local session)!', 'success');
        setSelectedOrderId('');
        setIsVerified(false);
        setVerificationToken('');
        setLoading(false);
      };

      return (
        <div className="max-w-2xl mx-auto card-luxury p-8 md:p-10 space-y-6 animate-fade-in">

            </div>
            <span className="text-xs font-mono text-neutral-400">Agent: {associateUser.name}</span>
          </div>

          {!selectedOrderId ? (
            <div className="space-y-4">
              <span className="text-[10px] uppercase tracking-wider text-neutral-400 block font-semibold">Assigned Home Visits</span>
              {pendingAppointments.length > 0 ? (

              ) : (
                <div className="border border-dashed border-[#E8E4DA] p-10 text-center space-y-3 bg-[#FAF8F5]/50">

                    ✦

                  <h4 className="font-serif-luxury text-lg text-neutral-800">No Home Visits Pending</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto">
                    All scheduled client measurement sessions have been completed.
                  </p>
                </div>
              )}
            </div>
          ) : (

              <button onClick={() => setSelectedOrderId('')} className="text-xs text-neutral-500 uppercase tracking-widest mb-6 block hover:text-black">

              <div className="bg-neutral-50 p-4 border border-[#E8E4DA] mb-6">

                    </span>

                {activeOrder.customOptions && (
                  <div className="mt-3 pt-2 border-t border-dashed border-[#E8E4DA] flex flex-wrap gap-2 text-[10px] text-neutral-600">
                    <span className="bg-white px-2 py-0.5 border border-[#E8E4DA]">Collar: <strong>{activeOrder.customOptions.collar || 'Standard Notch'}</strong></span>
                    <span className="bg-white px-2 py-0.5 border border-[#E8E4DA]">Pocket: <strong>{activeOrder.customOptions.pocket || 'Classic Flap'}</strong></span>
                    {activeOrder.customOptions.monogram && (

              {!isVerified ? (

                  <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">OTP Verification</span>

                  <input

    function BoutiquePartnerView({ orders, updateOrderStatus, currentUser, fetchOrders, showToast, boutiques }) {
      const [tab, setTab] = useState('production');
      const [loadingId, setLoadingId] = useState(null);
      const [selectedBoutiqueId, setSelectedBoutiqueId] = useState(() => currentUser?.boutiqueId || 'ALL');

      const studioOrders = selectedBoutiqueId === 'ALL'
        ? orders
        : orders.filter(o => o.boutiqueId === selectedBoutiqueId);

      const awaitingFitting = studioOrders.filter(o => o.status === 'booked' || o.status === 'associate_arriving');
      const inProduction = studioOrders.filter(o => o.status === 'measurements_taken' || o.status === 'in_production');
      const completed = studioOrders.filter(o => o.status === 'dispatched' || o.status === 'delivered');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handleStartStitching = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/production/orders/${orderId}/start-stitching`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'in_production');
            if (fetchOrders) fetchOrders();
            notify(`Order ${orderId} accepted into production! Stitching started.`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Action Failed: ${data.message || 'Could not start stitching.'}`, 'error');
          }
        } catch (err) {
          console.warn('API start stitching failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'in_production');
        notify(`Order ${orderId} stitching started (local session).`, 'success');
        setLoadingId(null);
      };

      const handleMarkReady = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/production/orders/${orderId}/mark-ready`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'dispatched');
            if (fetchOrders) fetchOrders();
            notify(`Order ${orderId} marked stitched! Delivery fleet notified.`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Action Failed: ${data.message || 'Could not mark order ready.'}`, 'error');
          }
        } catch (err) {
          console.warn('API mark-ready failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'dispatched');
        notify(`Order ${orderId} marked ready for pickup (local session).`, 'success');
        setLoadingId(null);
      };

      const handlePrintPatternCard = (orderId) => {
        const tokenQuery = currentUser?.token ? `?token=${encodeURIComponent(currentUser.token)}` : '';
        window.open(`/api/production/orders/${orderId}/pattern-card${tokenQuery}`, '_blank');
