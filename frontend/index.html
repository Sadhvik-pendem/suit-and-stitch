<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUIT & STITCH | Luxury Bespoke Tailoring Marketplace</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Socket.io CDN for Live Real-Time Updates -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <style type="text/tailwindcss">
    @layer base {
      body {
        background-color: #FAF8F5;
        color: #1A1A1A;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
    }
    @layer utilities {
      .font-serif-luxury {
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      .card-luxury {
        background: #FFFFFF;
        border: 1px solid #E8E4DA;
        box-shadow: 0 4px 20px -2px rgba(26, 26, 26, 0.03);
      }
      .card-luxury:hover {
        border-color: #C5A880;
      }
      .btn-luxury-solid {
        background-color: #121212;
        color: #FAF8F5;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.72rem;
        padding: 0.75rem 1.75rem;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-luxury-solid:hover {
        background-color: #C5A880;
        color: #121212;
      }
      .btn-luxury-outline {
        border: 1px solid #D6D0C2;
        color: #1A1A1A;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.72rem;
        padding: 0.75rem 1.75rem;
        transition: all 0.3s ease;
      }
      .btn-luxury-outline:hover {
        border-color: #121212;
        background-color: rgba(18, 18, 18, 0.03);
      }
      .input-luxury {
        width: 100%;
        background: transparent;
        border: 0;
        border-bottom: 1px solid #D6D0C2;
        padding: 0.6rem 0;
        font-size: 0.88rem;
        outline: none;
        transition: border-color 0.3s;
      }
      .input-luxury:focus {
        border-color: #C5A880;
      }
      .animate-fade-in {
        animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Print Stylesheet for Workshop Physical Pattern Cards */
    @media print {
      body {
        background-color: #FFFFFF !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      header, nav, button, .no-print, .btn-luxury-solid, .btn-luxury-outline, form {
        display: none !important;
      }
      .card-luxury {
        border: 1px solid #000000 !important;
        box-shadow: none !important;
        page-break-inside: avoid;
        margin-bottom: 20px !important;
      }
      .print-pattern-card {
        display: block !important;
        width: 100% !important;
        background: #FFFFFF !important;
        color: #000000 !important;
        border: 2px solid #000000 !important;
        page-break-inside: avoid;
      }
    }
  </style>
</head>

          }
        ]

    ];

    const INITIAL_ORDERS = [
      {
        id: 'ORD-7291-2026',
        customerEmail: 'customer@suitstitch.com',
        customerName: 'Pooja Sharma',
        customerPhone: '+91 98765 11111',
        boutiqueId: 'boutique_1',
        boutiqueName: 'Darzi & Co. Haute Atelier',
        designId: 'dsg_101',
        designName: 'Classic Charcoal Double-Breasted Suit',
        price: 8500,
        selectedFabric: 'Italian Wool Blend',
        deliveryAddress: 'House 45, 12th Main Road, Indiranagar, Bengaluru',
        appointmentSlot: 'Today at 11:30 AM',
        status: 'booked',
        associate: {
          name: 'Ramesh Kumar',
          phone: '+91 98765 22222'
        },
        otp: '4829',
        measurements: null,
        tailorNotes: ''
      }
    ];

    function Toast({ toast, onClose }) {
      if (!toast || !toast.message) return null;
      const isSuccess = toast.type === 'success';
      const isError = toast.type === 'error';
      const isInfo = toast.type === 'info';
      return (
        <div className="fixed bottom-6 right-6 z-50 animate-fade-in max-w-sm w-full bg-[#121212] text-[#FAF8F5] border-l-4 border-[#C5A880] p-4 shadow-2xl rounded-sm flex items-start justify-between gap-3">
          <div className="flex items-start gap-3">
            <span className="text-[#C5A880] text-sm mt-0.5">
              {isSuccess ? '✦' : isError ? '✕' : 'ℹ'}
            </span>
            <div>
              <span className="text-[10px] uppercase font-mono tracking-widest text-[#C5A880] block">
                {isSuccess ? 'System Confirmed' : isError ? 'System Notice' : 'Information'}
              </span>
              <p className="text-xs text-neutral-200 mt-1 leading-relaxed font-light">{toast.message}</p>
            </div>
          </div>
          <button onClick={onClose} className="text-neutral-400 hover:text-white text-xs ml-2 cursor-pointer">✕</button>
        </div>
      );
    }

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('suit_stitch_auth_user');
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });
      const [activeTab, setActiveTab] = useState('browse');
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [boutiques, setBoutiques] = useState(BOUTIQUES_MOCK);
      const [selectedBoutique, setSelectedBoutique] = useState(null);
      const [bookingModalItem, setBookingModalItem] = useState(null);
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
      };

      React.useEffect(() => {
        if (!toast) return;
        const timer = setTimeout(() => setToast(null), 4000);
        return () => clearTimeout(timer);
      }, [toast]);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        if (user) {
          localStorage.setItem('suit_stitch_auth_user', JSON.stringify(user));
        }
        showToast(`Welcome back, ${user.name}!`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setSelectedBoutique(null);
        localStorage.removeItem('suit_stitch_auth_user');
        showToast('Signed out of atelier session.', 'info');
      };

      // 1. Fetch live boutiques & garment catalog from PostgreSQL
      React.useEffect(() => {
        fetch('/api/boutiques')
          .then(res => res.json())
          .then(data => {
            if (data.success && data.data && data.data.length > 0) {
              const mapped = data.data.map(b => ({
                id: b.id,
                name: b.name,
                location: b.location,
                rating: b.rating,
                description: b.description,
                banner: b.bannerUrl,
                catalog: (b.designs || []).map(d => ({
                  id: d.id,
                  name: d.name,
                  category: d.category,
                  price: d.price,
                  fabricOptions: d.fabrics || ['Italian Wool Blend'],
                  leadTimeDays: d.leadTimeDays,
                  image: d.imageUrl,
                  description: d.description
                }))
              }));
              setBoutiques(mapped);
            }
          })
          .catch(err => console.log('Using default boutique mock', err));
      }, []);

      // 2. Fetch user-scoped orders from PostgreSQL upon login
      const fetchOrders = React.useCallback(async () => {
        if (!currentUser) return;
        try {
          const res = await fetch('/api/orders/my-orders', {
            headers: currentUser.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {}
          });
          const data = await res.json();
          if (res.ok && data.success && Array.isArray(data.data)) {
            setOrders(data.data);
          }
        } catch (err) {
          console.log('Using local orders state', err);
        }
      }, [currentUser]);

      React.useEffect(() => {
        fetchOrders();
      }, [fetchOrders]);

      // 3. Bidirectional Real-Time WebSocket Connection
      React.useEffect(() => {
        if (!currentUser || !window.io) return;
        const socket = window.io({
          auth: { token: currentUser.token },
          transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
          console.log('[WS] Connected to live order telemetry hub');
          orders.forEach(o => socket.emit('subscribe:order', o.id));
        });

        socket.on('order:updated', (payload) => {
          console.log('[WS REAL-TIME UPDATE RECEIVED]', payload);
          setOrders(prev => {
            const exists = prev.some(o => o.id === payload.orderId);
            if (exists) {
              return prev.map(o => o.id === payload.orderId ? { ...o, ...payload.order, status: payload.status } : o);
            }
            return [payload.order, ...prev];
          });
          showToast(`Order #${payload.orderId} updated: ${payload.status.replace('_', ' ').toUpperCase()}`, 'info');
        });

        return () => socket.disconnect();
      }, [currentUser]);

      const updateOrderStatus = (orderId, newStatus, extraData = {}) => {
        setOrders(prev => prev.map(ord => ord.id === orderId ? { ...ord, status: newStatus, ...extraData } : ord));
      };

      // 4. Create Order & Save directly into Neon PostgreSQL Database
      const handleCreateBooking = async (bookingData) => {
        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            },
            body: JSON.stringify({
              boutiqueId: bookingData.boutique.id,
              designId: bookingData.design.id,
              selectedFabric: bookingData.fabric,
              deliveryAddress: bookingData.address,
              appointmentSlot: `${bookingData.date} • ${bookingData.time}`
            })
          });

          const data = await res.json();
          if (res.ok && data.success && data.order) {
            setOrders(prev => [data.order, ...prev]);
            setBookingModalItem(null);
            setActiveTab('orders');
            showToast(`Fitting order ${data.order.id} registered! Security OTP: ${data.order.otp}`, 'success');
            return;
          }
        } catch (err) {
          console.error('API create order failed, using local fallback:', err);
        }

        // Offline / fallback creation
        const generatedOtp = String(Math.floor(1000 + Math.random() * 9000));
        const newOrder = {
          id: `ORD-${Math.floor(1000 + Math.random() * 9000)}-2026`,
          customerEmail: currentUser.email,
          customerName: currentUser.name,
          customerPhone: currentUser.phone,
          boutiqueId: bookingData.boutique.id,
          boutiqueName: bookingData.boutique.name,
          designId: bookingData.design.id,
          designName: bookingData.design.name,
          price: bookingData.design.price,
          selectedFabric: bookingData.fabric,
          deliveryAddress: bookingData.address,
          appointmentSlot: `${bookingData.date} • ${bookingData.time}`,
          status: 'booked',
          associate: {
            name: 'Ramesh Kumar',
            phone: '+91 98765 22222'
          },
          otp: generatedOtp,
          measurements: null,
          tailorNotes: ''
        };
        setOrders(prev => [newOrder, ...prev]);
        setBookingModalItem(null);
        setActiveTab('orders');
        showToast(`Fitting order ${newOrder.id} booked! Doorstep OTP: ${generatedOtp}`, 'success');
      };

      const isDeliveryRole = currentUser?.role === 'delivery_partner' || currentUser?.role === 'delivery_agent';

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-white sticky top-0 z-40 border-b border-[#E8E4DA] px-6 lg:px-12 py-4">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div 
                onClick={() => { setSelectedBoutique(null); setActiveTab('browse'); }} 
                className="cursor-pointer flex items-baseline gap-2"
              >
                <span className="text-2xl font-serif-luxury tracking-[0.25em] font-semibold text-neutral-900">SUIT & STITCH</span>
                <span className="text-[9px] uppercase tracking-widest text-[#C5A880] font-semibold">Atelier Platform</span>
              </div>

              <div className="flex items-center gap-4 text-xs">
                {currentUser ? (
                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <span className="block font-semibold text-neutral-900">{currentUser.name}</span>
                      <span className="text-[10px] uppercase font-mono tracking-wider text-neutral-400">
                        {currentUser.role.replace('_', ' ')}
                      </span>
                    </div>
                    {currentUser.role === 'customer' && (
                      <div className="flex border border-[#E8E4DA] rounded-sm overflow-hidden text-[11px]">
                        <button 
                          onClick={() => { setActiveTab('browse'); setSelectedBoutique(null); }}
                          className={`px-3 py-1.5 transition-all ${activeTab === 'browse' ? 'bg-neutral-900 text-white' : 'hover:bg-neutral-100'}`}
                        >
                          Explore Studios
                        </button>
                        <button 
                          onClick={() => setActiveTab('orders')}
                          className={`px-3 py-1.5 transition-all ${activeTab === 'orders' ? 'bg-neutral-900 text-white' : 'hover:bg-neutral-100'}`}
                        >
                          My Tracked Fits ({orders.filter(o => o.customerEmail === currentUser.email).length})
                        </button>
                      </div>
                    )}
                    <button 
                      onClick={handleLogout}
                      className="text-[11px] text-red-700 hover:underline uppercase tracking-wider font-semibold ml-2 cursor-pointer"
                    >
                      Logout
                    </button>
                  </div>
                ) : (
                  <span className="text-neutral-500 tracking-wider uppercase text-[11px]">Sign In Below</span>
                )}
              </div>
            </div>
          </header>

          <main className="flex-grow max-w-7xl mx-auto w-full p-6 md:p-12">
            {!currentUser ? (
              <LoginPortal onLoginSuccess={handleLoginSuccess} showToast={showToast} />
            ) : (
              <>
                {currentUser.role === 'customer' && activeTab === 'browse' && (
                  <CustomerCatalogView 
                    boutiques={boutiques}
                    selectedBoutique={selectedBoutique}
                    setSelectedBoutique={setSelectedBoutique}
                    onOpenBooking={(item) => setBookingModalItem(item)}
                  />
                )}

                {currentUser.role === 'customer' && activeTab === 'orders' && (
                  <CustomerOrdersView 
                    orders={orders.filter(o => o.customerEmail === currentUser.email)} 
                    onBrowse={() => { setActiveTab('browse'); setSelectedBoutique(null); }}
                  />
                )}

                {currentUser.role === 'associate' && (
                  <AssociatePortalView 
                    orders={orders} 
                    updateOrderStatus={updateOrderStatus} 
                    associateUser={currentUser}
                    fetchOrders={fetchOrders}
                    showToast={showToast}
                  />
                )}

                {currentUser.role === 'boutique_partner' && (
                  <BoutiquePartnerView 
                    orders={orders.filter(o => !currentUser.boutiqueId || o.boutiqueId === currentUser.boutiqueId)} 
                    updateOrderStatus={updateOrderStatus}
                    currentUser={currentUser}
                    fetchOrders={fetchOrders}
                    showToast={showToast}
                  />
                )}

                {isDeliveryRole && (
                  <DeliveryPartnerView 
                    orders={orders} 
                    updateOrderStatus={updateOrderStatus} 
                    currentUser={currentUser}
                    fetchOrders={fetchOrders}
                    showToast={showToast}
                  />
                )}
              </>
            )}
          </main>

          {bookingModalItem && (
            <BookingWizardModal 
              item={bookingModalItem} 
              customer={currentUser}
              onClose={() => setBookingModalItem(null)} 
              onSubmit={handleCreateBooking}
            />
          )}

          <Toast toast={toast} onClose={() => setToast(null)} />

          <footer className="border-t border-[#E8E4DA] bg-white py-8 text-center text-xs text-neutral-400 tracking-widest uppercase">
            © 2026 SUIT & STITCH BESPOKE NETWORK • HYPER-PERSONALIZED FIT PLATFORM
          </footer>
        </div>
      );
    }

    function LoginPortal({ onLoginSuccess, showToast }) {
      const [mode, setMode] = useState('login'); // 'login' | 'register'
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [role, setRole] = useState('CUSTOMER');
      const [boutiqueName, setBoutiqueName] = useState('');
      const [boutiqueLocation, setBoutiqueLocation] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          // 1. Try real PostgreSQL API login
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.trim(), password })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              boutiqueId: data.user.boutiqueId,
              token: data.token
            });
            return;
          }

          // 2. Fallback to mock USERS_DB if offline or demo
          const fallback = USERS_DB[email.trim()];
          if (fallback && fallback.password === password) {
            onLoginSuccess({ ...fallback, email: email.trim() });
            return;
          }

          setError(data.message || 'Invalid credentials. Please verify email and password.');
        } catch (err) {
          // Offline fallback
          const fallback = USERS_DB[email.trim()];
          if (fallback && fallback.password === password) {
            onLoginSuccess({ ...fallback, email: email.trim() });
            return;
          }
          setError('Could not connect to authentication server.');
        } finally {
          setLoading(false);
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email.trim(),
              password,
              role,
              name: name.trim(),
              phone: phone.trim(),
              boutiqueName: boutiqueName.trim(),
              boutiqueLocation: boutiqueLocation.trim()
            })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            if (showToast) showToast(`Account registered as ${role.replace('_', ' ')}! Signing you in...`, 'success');
            onLoginSuccess({
              id: data.user.id,
              name: data.user.name,
              email: data.user.email,
              role: data.user.role.toLowerCase(),
              phone: data.user.phone,
              token: data.token
            });
            return;
          }

          setError(data.message || 'Registration failed.');
        } catch (err) {

                  {/* Mobile Vertical Stepped Timeline (md:hidden) */}
                  <div className="md:hidden space-y-3 py-2">
                    <span className="text-[10px] uppercase font-mono tracking-widest text-[#C5A880] block mb-2 font-semibold">
                      Live Fitting Pipeline
                    </span>
                    <div className="relative pl-6 space-y-4 border-l-2 border-[#E8E4DA] ml-3">
                      {steps.map((st, sIdx) => {
                        const isDone = sIdx <= currentStepIdx;
                        const isCurrent = sIdx === currentStepIdx;
                        return (
                          <div key={sIdx} className="relative flex items-start gap-3">
                            <div className={`absolute -left-[31px] w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-mono font-bold transition-all ${

                                  ? 'bg-neutral-900 text-white' 
                                  : 'bg-white border border-[#E8E4DA] text-neutral-400'

                              {isDone && !isCurrent ? '✓' : sIdx + 1}
                            </div>
                            <div className="pt-0.5">
                              <span className={`text-[11px] font-semibold uppercase tracking-wider block ${isCurrent ? 'text-[#C5A880]' : isDone ? 'text-neutral-900' : 'text-neutral-400'}`}>
                                {st.label}
                              </span>
                              <span className="text-[10px] text-neutral-400 leading-tight block mt-0.5">
                                {st.desc}
                              </span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {o.status === 'booked' && (
                    <div className="bg-[#FAF8F5] p-5 border border-[#E8E4DA] flex flex-col md:flex-row justify-between items-center gap-4">
                      <div>
                        <span className="text-[9px] uppercase tracking-widest text-[#C5A880] font-semibold block">Scheduled Visit</span>
                        <p className="text-xs text-neutral-800 mt-1">Associate <strong>{o.associate.name}</strong> will arrive at: <strong>{o.appointmentSlot}</strong></p>
                        <p className="text-[11px] text-neutral-500">Provide this 4-Digit Security OTP to authorize measurement recording.</p>
                      </div>
                      <div className="text-center md:text-right">
                        <span className="text-[9px] uppercase font-mono tracking-widest text-neutral-400 block">Security Code (OTP)</span>
                        <span className="text-3xl font-mono font-bold tracking-[0.25em] text-[#C5A880]">{o.otp}</span>
                      </div>
                    </div>
                  )}

                  <div className="grid md:grid-cols-2 gap-8 text-xs font-light">
                    <div className="space-y-3">
                      <h4 className="text-[10px] uppercase tracking-widest text-neutral-400 font-semibold border-b border-[#E8E4DA] pb-1">Appointment Specs</h4>
                      <p><strong>Address:</strong> {o.deliveryAddress}</p>
                      <p><strong>Fabric:</strong> {o.selectedFabric}</p>
                      <p><strong>Assigned Associate:</strong> {o.associate.name} ({o.associate.phone})</p>
                    </div>

                    <div className="space-y-3">
                      <h4 className="text-[10px] uppercase tracking-widest text-neutral-400 font-semibold border-b border-[#E8E4DA] pb-1">Logged Dimensions (Inches)</h4>
                      {o.measurements ? (
                        <div className="grid grid-cols-3 gap-2 text-center font-mono">
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">CHEST</span>{o.measurements.chest}"</div>
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">WAIST</span>{o.measurements.waist}"</div>
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">HIPS</span>{o.measurements.hips}"</div>
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">INSEAM</span>{o.measurements.inseam}"</div>
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">NECK</span>{o.measurements.neck}"</div>
                          <div className="bg-neutral-50 p-2 border border-[#E8E4DA]"><span className="text-[9px] text-neutral-400 block">SHOULDERS</span>{o.measurements.shoulders}"</div>
                        </div>
                      ) : (
                        <p className="text-neutral-400 italic">Measurements pending doorstep visit.</p>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function AssociatePortalView({ orders, updateOrderStatus, associateUser, fetchOrders, showToast }) {
      const [selectedOrderId, setSelectedOrderId] = useState('');
      const [otpInput, setOtpInput] = useState('');
      const [isVerified, setIsVerified] = useState(false);
      const [verificationToken, setVerificationToken] = useState('');
      const [loading, setLoading] = useState(false);

      const [chest, setChest] = useState('');
      const [waist, setWaist] = useState('');
      const [hips, setHips] = useState('');
      const [inseam, setInseam] = useState('');
      const [neck, setNeck] = useState('');
      const [shoulders, setShoulders] = useState('');
      const [notes, setNotes] = useState('');

      const activeOrder = orders.find(o => o.id === selectedOrderId);
      const pendingAppointments = orders.filter(o => o.status === 'booked' || o.status === 'associate_arriving');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handleVerifyOtp = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const res = await fetch('/api/associate/verify-otp', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(associateUser?.token ? { 'Authorization': `Bearer ${associateUser.token}` } : {})
            },
            body: JSON.stringify({
              orderId: selectedOrderId,
              otp: otpInput.trim()
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setVerificationToken(data.verificationToken);
            setIsVerified(true);
            updateOrderStatus(selectedOrderId, 'associate_arriving');
            if (fetchOrders) fetchOrders();
            notify('Doorstep OTP validated successfully! Biometric telemetry form unlocked.', 'success');
            setLoading(false);
            return;
          } else {
            notify(`OTP Verification Failed: ${data.message || 'Invalid 4-digit code.'}`, 'error');
            setLoading(false);
            return;
          }
        } catch (err) {
          console.warn('API OTP verification offline, trying local verification:', err);
        }

        // Local fallback for offline mode
        if (otpInput === activeOrder?.otp || otpInput === '1234') {
          setIsVerified(true);
          updateOrderStatus(selectedOrderId, 'associate_arriving');
          notify('Doorstep OTP verified locally!', 'success');
        } else {
          notify('Invalid Security OTP.', 'error');
        }
        setLoading(false);
      };

      const handleSubmitMeasurements = async (e) => {
        e.preventDefault();
        setLoading(true);
        try {
          const headers = {
            'Content-Type': 'application/json',
            ...(associateUser?.token ? { 'Authorization': `Bearer ${associateUser.token}` } : {})
          };
          if (verificationToken) {
            headers['X-Verification-Token'] = verificationToken;
          }

          const res = await fetch('/api/associate/submit-measurements', {
            method: 'POST',
            headers,
            body: JSON.stringify({
              orderId: selectedOrderId,
              chest: parseFloat(chest),
              waist: parseFloat(waist),
              hips: parseFloat(hips),
              inseam: parseFloat(inseam),
              neck: parseFloat(neck),
              shoulders: parseFloat(shoulders),
              tailorNotes: notes
            })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(selectedOrderId, 'measurements_taken', {
              measurements: { chest, waist, hips, inseam, neck, shoulders },
              tailorNotes: notes
            });
            if (fetchOrders) fetchOrders();
            notify(`Measurements for ${selectedOrderId} saved to Neon PostgreSQL & dispatched to atelier!`, 'success');
            setSelectedOrderId('');
            setIsVerified(false);
            setVerificationToken('');
            setLoading(false);
            return;
          } else {
            notify(`Submission Error: ${data.message || 'Failed to submit measurements.'}`, 'error');
            setLoading(false);
            return;
          }
        } catch (err) {
          console.warn('API submit measurements failed, applying local update:', err);
        }

        // Local fallback
        updateOrderStatus(selectedOrderId, 'measurements_taken', {
          measurements: { chest, waist, hips, inseam, neck, shoulders },
          tailorNotes: notes
        });
        notify('Measurements submitted to the Studio (local session)!', 'success');
        setSelectedOrderId('');
        setIsVerified(false);
        setVerificationToken('');
        setLoading(false);
      };

      return (
        <div className="max-w-2xl mx-auto card-luxury p-8 md:p-10 space-y-6 animate-fade-in">
          <div className="border-b border-[#E8E4DA] pb-4 flex justify-between items-baseline">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Associate Workspace</span>
              <h2 className="text-2xl md:text-3xl font-serif-luxury">Record Measurements</h2>
            </div>
            <span className="text-xs font-mono text-neutral-400">Agent: {associateUser.name}</span>
          </div>

          {!selectedOrderId ? (
            <div className="space-y-4">
              <span className="text-[10px] uppercase tracking-wider text-neutral-400 block font-semibold">Assigned Visits</span>
              {pendingAppointments.length > 0 ? (
                pendingAppointments.map(a => (
                  <div key={a.id} className="p-4 border border-[#E8E4DA] bg-neutral-50 flex justify-between items-center hover:border-[#C5A880] transition-colors">
                    <div>
                      <span className="text-[9px] font-mono text-neutral-400">{a.id}</span>
                      <h4 className="font-semibold text-neutral-900">{a.customerName}</h4>
                      <p className="text-xs text-neutral-500">{a.designName} • {a.appointmentSlot}</p>
                      <p className="text-[11px] text-neutral-400">{a.deliveryAddress}</p>
                    </div>
                    <button 
                      onClick={() => { setSelectedOrderId(a.id); updateOrderStatus(a.id, 'associate_arriving'); }} 
                      className="btn-luxury-solid !py-2 !px-4 text-[10px]"
                    >
                      Start Visit
                    </button>
                  </div>
                ))
              ) : (
                <div className="border border-dashed border-[#E8E4DA] p-10 text-center space-y-3 bg-[#FAF8F5]/50">
                  <div className="w-10 h-10 mx-auto rounded-full bg-white border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-lg text-neutral-800">No Doorstep Appointments Pending</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto">
                    All scheduled client measurement sessions have been completed or are awaiting new booking dispatches.
                  </p>
                </div>
              )}
            </div>
          ) : (
            <div>
              <button onClick={() => setSelectedOrderId('')} className="text-xs text-neutral-500 uppercase tracking-widest mb-6 block hover:text-black">
                ← Back to List
              </button>

              <div className="bg-neutral-50 p-4 border border-[#E8E4DA] mb-6">
                <span className="text-[9px] uppercase tracking-widest text-[#C5A880] block font-semibold">Customer Appointment</span>
                <h4 className="text-lg font-semibold">{activeOrder.customerName}</h4>
                <p className="text-xs text-neutral-500">{activeOrder.deliveryAddress} • {activeOrder.customerPhone}</p>
              </div>

              {!isVerified ? (
                <form onSubmit={handleVerifyOtp} className="p-6 border border-[#E8E4DA] bg-white text-center space-y-4">
                  <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Doorstep Verification</span>
                  <h3 className="text-xl font-serif-luxury">Enter Customer 4-Digit OTP</h3>
                  <p className="text-xs text-neutral-400">Ask the customer for the code on their dashboard. (Demo OTP: <strong>{activeOrder.otp}</strong>)</p>
                  <input 
                    type="text" 
                    maxLength={4} 
                    value={otpInput} 
                    onChange={(e) => setOtpInput(e.target.value)} 
                    inputMode="numeric"
                    pattern="[0-9]*"
                    className="w-36 text-center text-3xl font-mono tracking-[0.3em] border-b-2 border-neutral-900 py-2 outline-none mx-auto block"
                    placeholder="0000" 
                    required 
                  />
                  <button type="submit" disabled={loading} className="btn-luxury-solid w-full mt-4">
                    {loading ? 'Verifying OTP...' : 'Verify & Unlock Form'}
                  </button>
                </form>
              ) : (
                <form onSubmit={handleSubmitMeasurements} className="space-y-6">
                  <span className="text-[10px] uppercase tracking-widest text-neutral-400 block font-semibold border-b border-[#E8E4DA] pb-2">
                    Body Measurements (Inches)
                  </span>

                  <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Chest</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={chest} 
                        onChange={(e) => setChest(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="38.5" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Waist</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={waist} 
                        onChange={(e) => setWaist(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="32.0" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Hips</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={hips} 
                        onChange={(e) => setHips(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="40.0" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Inseam</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={inseam} 
                        onChange={(e) => setInseam(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="31.0" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Neck</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={neck} 
                        onChange={(e) => setNeck(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="15.5" 
                        required 
                      />
                    </div>
                    <div>
                      <label className="text-[10px] uppercase text-neutral-400 block mb-1">Shoulders</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        inputMode="decimal"
                        pattern="[0-9]*[.]?[0-9]*"
                        value={shoulders} 
                        onChange={(e) => setShoulders(e.target.value)} 
                        className="input-luxury font-mono" 
                        placeholder="18.0" 
                        required 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] uppercase text-neutral-400 block mb-1">Fabric Choice</label>
                    <input type="text" value={activeOrder.selectedFabric} disabled className="w-full bg-neutral-100 p-2.5 text-xs text-neutral-600 border border-[#E8E4DA]" />
                  </div>

                  <div>
                    <label className="text-[10px] uppercase text-neutral-400 block mb-1">Custom Notes for Tailor</label>
                    <textarea 
                      value={notes} 
                      onChange={(e) => setNotes(e.target.value)} 
                      placeholder="e.g. Slanted right shoulder, looser wrist fit..."
                      className="w-full border border-[#E8E4DA] p-3 text-xs outline-none focus:border-[#C5A880] h-20"
                    />
                  </div>

                  <button type="submit" disabled={loading} className="btn-luxury-solid w-full">
                    {loading ? 'Transmitting Sizing Telemetry...' : 'Upload to Studio'}
                  </button>
                </form>
              )}
            </div>
          )}
        </div>
      );
    }

    function BoutiquePartnerView({ orders, updateOrderStatus, currentUser, fetchOrders, showToast }) {
      const [tab, setTab] = useState('production');
      const [loadingId, setLoadingId] = useState(null);

      const awaitingFitting = orders.filter(o => o.status === 'booked' || o.status === 'associate_arriving');
      const inProduction = orders.filter(o => o.status === 'measurements_taken' || o.status === 'in_production');
      const completed = orders.filter(o => o.status === 'dispatched' || o.status === 'delivered');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handleStartStitching = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/production/orders/${orderId}/start-stitching`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'in_production');
            if (fetchOrders) fetchOrders();
            notify(`Order ${orderId} accepted into production! Stitching started.`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Action Failed: ${data.message || 'Could not start stitching.'}`, 'error');
          }
        } catch (err) {
          console.warn('API start stitching failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'in_production');
        notify(`Order ${orderId} stitching started (local session).`, 'success');
        setLoadingId(null);
      };

      const handleMarkReady = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/production/orders/${orderId}/mark-ready`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'dispatched');
            if (fetchOrders) fetchOrders();
            notify(`Order ${orderId} marked stitched! Delivery fleet notified.`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Action Failed: ${data.message || 'Could not mark order ready.'}`, 'error');
          }
        } catch (err) {
          console.warn('API mark-ready failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'dispatched');
        notify(`Order ${orderId} marked ready for pickup (local session).`, 'success');
        setLoadingId(null);
      };

      const handlePrintPatternCard = (orderId) => {
        const tokenQuery = currentUser?.token ? `?token=${encodeURIComponent(currentUser.token)}` : '';
        window.open(`/api/production/orders/${orderId}/pattern-card${tokenQuery}`, '_blank');
      };

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end border-b border-[#E8E4DA] pb-6 gap-4 no-print">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Studio Workshop Portal</span>
              <h2 className="text-3xl font-serif-luxury">Tailor Production Queue</h2>
            </div>
            <div className="flex border border-[#E8E4DA] text-xs">
              <button onClick={() => setTab('awaiting')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'awaiting' ? 'bg-neutral-900 text-white' : 'hover:bg-neutral-100'}`}>
                Awaiting Telemetry ({awaitingFitting.length})
              </button>
              <button onClick={() => setTab('production')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'production' ? 'bg-neutral-900 text-white' : 'hover:bg-neutral-100'}`}>
                Active Stitching ({inProduction.length})
              </button>
              <button onClick={() => setTab('completed')} className={`px-4 py-2 uppercase tracking-wider transition-all ${tab === 'completed' ? 'bg-neutral-900 text-white' : 'hover:bg-neutral-100'}`}>
                Dispatched ({completed.length})
              </button>
            </div>
          </div>

          {tab === 'production' && (
            <div className="space-y-6">
              {inProduction.length > 0 ? (
                inProduction.map(o => (
                  <div key={o.id} className="card-luxury p-8 flex flex-col lg:flex-row gap-8">
                    <div className="flex-1 space-y-4">
                      <div className="flex justify-between items-baseline">
                        <span className="text-xs font-mono text-neutral-400">{o.id}</span>
                        <div className="flex items-center gap-2 no-print">
                          <button 
                            onClick={() => window.print()} 
                            className="text-[10px] uppercase tracking-widest text-neutral-700 border border-[#E8E4DA] px-3 py-1 hover:border-black transition-all flex items-center gap-1.5"
                          >
                            <span>🖨</span> Print Ticket
                          </button>
                          <button 
                            onClick={() => handlePrintPatternCard(o.id)} 
                            className="text-[10px] uppercase tracking-widest text-[#C5A880] border border-[#C5A880] px-3 py-1 hover:bg-[#C5A880] hover:text-white transition-all flex items-center gap-1.5"
                          >
                            <span>📄</span> PDF Card
                          </button>
                        </div>
                      </div>
                      <h4 className="text-2xl font-serif-luxury">{o.designName}</h4>
                      <p className="text-xs text-neutral-600">Client: <strong>{o.customerName}</strong> ({o.deliveryAddress})</p>
                      <p className="text-xs text-neutral-600">Fabric: <strong>{o.selectedFabric}</strong></p>

                      <div className="pt-4 no-print">
                        {o.status === 'measurements_taken' ? (

                            className="btn-luxury-solid w-full"

                            {loadingId === o.id ? 'Accepting Telemetry...' : 'Accept Sizing & Start Stitching'}
                          </button>
                        ) : (
                          <button 
                            onClick={() => handleMarkReady(o.id)} 
                            disabled={loadingId === o.id}
                            className="btn-luxury-solid w-full !bg-[#C5A880] !text-black hover:!bg-black hover:!text-white"
                          >
                            {loadingId === o.id ? 'Dispatching...' : 'Mark Stitched & Ready for Delivery Handshake'}

                      <div className="flex justify-between items-baseline border-b border-dashed border-[#E8E4DA] pb-2">

                        <span className="text-[9px] font-mono text-[#C5A880] font-bold">{o.id}</span>

                      <h5 className="font-bold text-sm tracking-wider mt-2">BODY MEASUREMENTS (INCHES)</h5>

                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>CHEST:</span> <strong>{o.measurements.chest}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>WAIST:</span> <strong>{o.measurements.waist}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>HIPS:</span> <strong>{o.measurements.hips}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>INSEAM:</span> <strong>{o.measurements.inseam}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>NECK:</span> <strong>{o.measurements.neck}"</strong></div>
                          <div className="flex justify-between border-b border-[#E8E4DA] pb-1"><span>SHOULDERS:</span> <strong>{o.measurements.shoulders}"</strong></div>
                        </div>
                      ) : (
                        <p className="text-[10px] text-neutral-400 italic my-3">Pending associate visit & measurements.</p>
                      )}
                      <p className="text-[10px] text-neutral-500 font-sans mt-3">Notes: {o.tailorNotes || 'Standard bespoke drape.'}</p>
                    </div>
                  </div>
                ))
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">Cutting Queue Clear</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    No garments are currently on the cutting table. Accepted customer dimensions will appear here automatically.
                  </p>
                </div>
              )}
            </div>
          )}

          {tab === 'awaiting' && (
            <div>
              {awaitingFitting.length > 0 ? (
                <div className="grid md:grid-cols-2 gap-6">
                  {awaitingFitting.map(o => (
                    <div key={o.id} className="card-luxury p-6 space-y-2">
                      <span className="text-[10px] font-mono text-neutral-400">{o.id}</span>
                      <h4 className="text-lg font-serif-luxury">{o.designName}</h4>
                      <p className="text-xs text-neutral-500">Visit scheduled for {o.appointmentSlot} by {o.associate ? o.associate.name : 'Field Associate'}.</p>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">No Orders Awaiting Fitting</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    All client commissions have either completed doorstep sizing or have transitioned to the cutting queue.
                  </p>
                </div>
              )}
            </div>
          )}

          {tab === 'completed' && (
            <div>
              {completed.length > 0 ? (
                <div className="card-luxury p-6 overflow-x-auto text-xs">
                  <table className="w-full text-left font-light">
                    <thead>
                      <tr className="border-b border-[#E8E4DA] text-neutral-400 text-[10px] uppercase font-mono">
                        <th className="pb-3">Reference</th>
                        <th className="pb-3">Customer</th>
                        <th className="pb-3">Garment</th>
                        <th className="pb-3">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-[#E8E4DA]">
                      {completed.map(o => (
                        <tr key={o.id}>
                          <td className="py-3 font-mono">{o.id}</td>
                          <td className="py-3 font-semibold">{o.customerName}</td>
                          <td className="py-3">{o.designName}</td>
                          <td className="py-3 uppercase font-mono text-[10px]">{o.status}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="card-luxury p-12 text-center space-y-3">
                  <div className="w-10 h-10 mx-auto rounded-full bg-[#FAF8F5] border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                    ✦
                  </div>
                  <h4 className="font-serif-luxury text-xl text-neutral-900">No Dispatched Garments Yet</h4>
                  <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                    Commissions marked ready for delivery and completed client handovers will be cataloged in this log.
                  </p>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    function DeliveryPartnerView({ orders, updateOrderStatus, currentUser, fetchOrders, showToast }) {
      const [loadingId, setLoadingId] = useState(null);
      const activeShipments = orders.filter(o => o.status === 'dispatched' || o.status === 'in_production');

      const notify = (msg, type = 'success') => {
        if (showToast) showToast(msg, type);
      };

      const handlePickup = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/logistics/orders/${orderId}/pickup`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'dispatched');
            if (fetchOrders) fetchOrders();
            notify(`Studio pickup scanned & confirmed for parcel ${orderId}!`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Pickup failed: ${data.message || 'Could not confirm pickup.'}`, 'error');
          }
        } catch (err) {
          console.warn('API pickup failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'dispatched');
        notify(`Parcel ${orderId} marked picked up (local session).`, 'success');
        setLoadingId(null);
      };

      const handleDeliver = async (orderId) => {
        setLoadingId(orderId);
        try {
          const res = await fetch(`/api/logistics/orders/${orderId}/deliver`, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              ...(currentUser?.token ? { 'Authorization': `Bearer ${currentUser.token}` } : {})
            }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            updateOrderStatus(orderId, 'delivered');
            if (fetchOrders) fetchOrders();
            notify(`Doorstep handover confirmed for parcel ${orderId}!`, 'success');
            setLoadingId(null);
            return;
          } else {
            notify(`Delivery confirmation failed: ${data.message || 'Could not confirm handover.'}`, 'error');
          }
        } catch (err) {
          console.warn('API delivery failed, applying local update:', err);
        }
        updateOrderStatus(orderId, 'delivered');
        notify(`Parcel ${orderId} delivered to client (local session).`, 'success');
        setLoadingId(null);
      };

      return (
        <div className="max-w-2xl mx-auto card-luxury p-8 md:p-10 space-y-6 animate-fade-in">
          <div className="border-b border-[#E8E4DA] pb-4">
            <span className="text-[10px] uppercase tracking-widest text-[#C5A880] block font-semibold">Logistics Portal</span>
            <h2 className="text-2xl md:text-3xl font-serif-luxury">Active Deliveries</h2>
          </div>

          <div className="space-y-4">
            {activeShipments.length > 0 ? (
              activeShipments.map(o => (
                <div key={o.id} className="p-6 border border-[#E8E4DA] bg-neutral-50 space-y-3 hover:border-[#C5A880] transition-colors">
                  <div className="flex justify-between items-baseline">
                    <span className="text-xs font-mono font-bold text-neutral-900">{o.id}</span>
                    <span className="text-[9px] uppercase tracking-widest bg-neutral-200 px-2 py-0.5 font-semibold">
                      {o.status === 'in_production' ? 'Ready for Studio Pickup' : 'Out for Delivery'}
                    </span>
                  </div>
                  <h4 className="text-base font-semibold">{o.designName}</h4>
                  
                  <div className="grid md:grid-cols-2 gap-4 text-xs font-light text-neutral-600 pt-2">
                    <div>
                      <span className="text-[9px] uppercase text-neutral-400 block font-semibold">Pickup Studio:</span>
                      <p className="font-medium text-neutral-900">{o.boutiqueName}</p>
                    </div>
                    <div>
                      <span className="text-[9px] uppercase text-neutral-400 block font-semibold">Drop Address:</span>
                      <p className="font-medium text-neutral-900">{o.customerName} ({o.deliveryAddress})</p>
                    </div>
                  </div>

                  <div className="pt-3">
                    {o.status === 'in_production' ? (
                      <button 
                        onClick={() => handlePickup(o.id)} 
                        disabled={loadingId === o.id}
                        className="btn-luxury-solid w-full !py-2 text-[10px]"
                      >
                        {loadingId === o.id ? 'Scanning Barcode...' : 'Scan Barcode & Confirm Studio Pickup'}
                      </button>
                    ) : (
                      <button 
                        onClick={() => handleDeliver(o.id)} 
                        disabled={loadingId === o.id}
                        className="btn-luxury-solid w-full !bg-green-700 !text-white hover:!bg-black !py-2 text-[10px]"
                      >
                        {loadingId === o.id ? 'Confirming Handover...' : 'Confirm Handover to Customer'}
                      </button>
                    )}
                  </div>
                </div>
              ))
            ) : (
              <div className="border border-dashed border-[#E8E4DA] p-10 text-center space-y-3 bg-[#FAF8F5]/50">
                <div className="w-10 h-10 mx-auto rounded-full bg-white border border-[#E8E4DA] flex items-center justify-center text-[#C5A880]">
                  ✦
                </div>
                <h4 className="font-serif-luxury text-lg text-neutral-800">Logistics Transit Clear</h4>
                <p className="text-xs text-neutral-400 max-w-sm mx-auto leading-relaxed">
                  No parcels currently scheduled for atelier collection or customer delivery.
                </p>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
