services:
  - type: web
    name: suit-and-stitch
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install && npm run build:prod
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'
      - key: FROM_EMAIL
        value: concierge@suitstitch.com
